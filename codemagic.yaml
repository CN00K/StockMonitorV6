# Manual only: intentionally no `triggering` events or publishing section.
# Before starting: verify this personal account has at least 30 available free
# macOS M2 minutes, no competing builds consuming them, and no charge is required.
# Do not enable billing. No signing credentials or variable groups are used.
workflows:
  unsigned-ios:
    name: StockMonitorV6 manual unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.cn00k.stockmonitorv6
        APP_GROUP_ID: group.com.cn00k.stockmonitorv6
    scripts:
      - name: Verify main and prepare XcodeGen
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          test "${CM_BRANCH:-}" = main
          test -f Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen generate
      - name: Build and package unsigned arm64 IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          DERIVED_DATA="$CM_BUILD_DIR/build/DerivedData"
          STAGING_DIR="$CM_BUILD_DIR/build/unsigned-staging"
          ARTIFACT_DIR="$CM_BUILD_DIR/build/unsigned-artifacts"
          xcodebuild \
            -project StockMonitorV6.xcodeproj \
            -scheme MonitorApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            STOCKMONITOR_APP_BUNDLE_ID="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          APP_INFO="$APP_PATH/Info.plist"
          test -f "$APP_INFO"
          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")
          test "$ACTUAL_BUNDLE_ID" = "$BUNDLE_ID"
          APP_GROUP_FROM_ENTITLEMENTS=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' App/StockMonitor.entitlements)
          test "$APP_GROUP_FROM_ENTITLEMENTS" = "$APP_GROUP_ID"
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_INFO")
          APP_ARCHS="$(xcrun lipo -archs "$APP_PATH/$APP_EXECUTABLE" | xargs)"
          test "$APP_ARCHS" = arm64
          APP_ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP_INFO")
          test "$APP_ICON_NAME" = AppIcon

          SIGNING_MARKER="$(find "$APP_PATH" \( -type d -name _CodeSignature -o -type f -name embedded.mobileprovision \) -print -quit)"
          if [ -n "$SIGNING_MARKER" ] || codesign --verify "$APP_PATH" >/dev/null 2>&1; then
            echo 'ERROR: Unexpected code signature or provisioning profile in unsigned app' >&2
            exit 1
          fi

          mkdir -p "$STAGING_DIR/Payload" "$ARTIFACT_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/Payload/$(basename "$APP_PATH")"
          IPA_PATH="$ARTIFACT_DIR/StockMonitorV6-unsigned.ipa"
          (cd "$STAGING_DIR" && zip -qry "$IPA_PATH" Payload)
          unzip -tq "$IPA_PATH"
          ZIP_LIST="$ARTIFACT_DIR/StockMonitorV6-ipa-files.txt"
          unzip -Z1 "$IPA_PATH" > "$ZIP_LIST"
          grep -Fqx "Payload/$(basename "$APP_PATH")/Info.plist" "$ZIP_LIST"
          if grep -E '(^|/)_CodeSignature/|(^|/)embedded\.mobileprovision$' "$ZIP_LIST"; then
            echo 'ERROR: Unsigned IPA unexpectedly contains signing assets' >&2
            exit 1
          fi

          cp App/StockMonitor.entitlements "$ARTIFACT_DIR/StockMonitorV6-signing.entitlements"
          IPA_SHA256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          IPA_SIZE_BYTES="$(stat -f%z "$IPA_PATH")"
          IPA_FILE_COUNT="$(wc -l < "$ZIP_LIST" | tr -d ' ')"
          ICON_SHA256="$(shasum -a 256 Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '{print $1}')"
          cat > "$ARTIFACT_DIR/StockMonitorV6-build-manifest.txt" <<EOF
          source_commit=$(git rev-parse HEAD)
          bundle_id=$ACTUAL_BUNDLE_ID
          app_group_from_entitlements=$APP_GROUP_FROM_ENTITLEMENTS
          architecture=$APP_ARCHS
          app_icon_name=$APP_ICON_NAME
          app_icon_source_sha256=$ICON_SHA256
          code_signing=disabled
          embedded_provisioning_profile=no
          signed_entitlements_embedded=no; use the included .entitlements file when signing
          ipa_sha256=$IPA_SHA256
          ipa_size_bytes=$IPA_SIZE_BYTES
          ipa_file_count=$IPA_FILE_COUNT
          EOF
    artifacts:
      - build/unsigned-artifacts/*
