name: StockMonitorV6
options:
  bundleIdPrefix: com.example.stockmonitor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  StockMonitorCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/StockMonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stockmonitor.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
  MonitorApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    resources:
      - Resources/collector.yaml
      - Resources/sector_map.json
      - Resources/PrivacyInfo.xcprivacy
    dependencies:
      - target: StockMonitorCore
    settings:
      base:
        STOCKMONITOR_APP_BUNDLE_ID: com.example.stockmonitor.app
        PRODUCT_BUNDLE_IDENTIFIER: "$(STOCKMONITOR_APP_BUNDLE_ID)"
        PRODUCT_NAME: Stock Monitor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/StockMonitor.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
