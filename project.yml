name: StockMonitorV6
options:
  bundleIdPrefix: com.cn00k
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  StockMonitorCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/StockMonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cn00k.stockmonitorv6.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
  MonitorApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - path: Resources/collector.yaml
        buildPhase: resources
      - path: Resources/sector_map.json
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: StockMonitorCore
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.cn00k.stockmonitorv6
            CFBundleURLSchemes:
              - stockmonitor
    settings:
      base:
        STOCKMONITOR_APP_BUNDLE_ID: com.cn00k.stockmonitorv6
        PRODUCT_BUNDLE_IDENTIFIER: "$(STOCKMONITOR_APP_BUNDLE_ID)"
        PRODUCT_NAME: Stock Monitor
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/StockMonitor.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
